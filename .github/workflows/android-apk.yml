name: Build Kyr Free Fire APK
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'www/**'
      - 'index.html'
      - 'game3d.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate inline JavaScript
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          for (const file of ['index.html', 'game3d.html']) {
            const html = readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
            let checked = 0;
            for (const match of scripts) {
              if (/type\s*=\s*["']importmap["']/i.test(match[1])) continue;
              if (!match[2].trim()) continue;
              execFileSync(process.execPath, ['--check', '--input-type=module'], {
                input: match[2],
                stdio: ['pipe', 'inherit', 'inherit']
              });
              checked++;
            }
            if (!checked) throw new Error(`No inline JavaScript found in ${file}`);
            console.log(`${file}: checked ${checked} inline script(s)`);
          }
          NODE
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s, n = re.subn(r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*)(>)', r'\1 android:screenOrientation="landscape"\2', s, count=1)
          if n != 1:
              raise SystemExit('Could not set MainActivity landscape orientation')
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kyr-Free-Fire.apk
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Kyr Free Fire for Android
          body: Automatically built Android installer for Kyr Free Fire.
          files: Kyr-Free-Fire.apk
          make_latest: true
