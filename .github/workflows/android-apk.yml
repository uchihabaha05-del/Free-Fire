name: MASS BATTLE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - visual-upgrade/realistic-battlefield
    paths:
      - "project.godot"
      - "main.tscn"
      - "scripts/**"
      - "assets/**"
      - "export_presets.cfg"
      - "ci/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: mass-battle-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build debug APK (Godot 4.3)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Spider-Man model from uploaded asset archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="assets/assets/SpideyMesh.zip"
          test -s "$ARCHIVE"
          mkdir -p assets/characters "$RUNNER_TEMP/spidey-model"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/spidey-model"
          test -s "$RUNNER_TEMP/spidey-model/SpideyMesh.dae"
          test -s "$RUNNER_TEMP/spidey-model/Spidey512.png"
          cp "$RUNNER_TEMP/spidey-model/SpideyMesh.dae" assets/characters/SpideyMesh.dae
          cp "$RUNNER_TEMP/spidey-model/Spidey512.png" assets/characters/Spidey512.png
          echo "Installed Spider-Man COLLADA model and texture:"
          ls -lh assets/characters/SpideyMesh.dae assets/characters/Spidey512.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK on GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDKMANAGER" > "$RUNNER_TEMP/sdkmanager-path"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages for Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(cat "$RUNNER_TEMP/sdkmanager-path")"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Download Godot 4.3 editor and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3-stable"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            --output godot.zip
          unzip -q godot.zip -d godot-bin
          sudo install -m 0755 godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            --output export_templates.tpz
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          TEMPLATE_TMP="$RUNNER_TEMP/godot-export-templates"
          mkdir -p "$TEMPLATE_DIR" "$TEMPLATE_TMP"
          unzip -q -o export_templates.tpz -d "$TEMPLATE_TMP"
          test -d "$TEMPLATE_TMP/templates"
          find "$TEMPLATE_TMP/templates" -maxdepth 1 -type f -exec cp -t "$TEMPLATE_DIR" {} +
          godot --version
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/mass-battle-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project resources
        run: godot --headless --editor --path . --import

      - name: Configure Godot Android export settings
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/mass-battle-debug.keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -s "$HOME/.config/godot/editor_settings-4.tres"

      - name: Headless editor validation (fail on GDScript errors)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit 2>&1 | tee editor-validation.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:" editor-validation.log; then
            echo "GDScript validation failed; refusing to export APK."
            exit 1
          fi

      - name: Headless game startup check (fail on script errors)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee game-startup.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:" game-startup.log; then
            echo "Game startup validation failed; refusing to export APK."
            exit 1
          fi

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/MASS-BATTLE-debug.apk
          test -s build/MASS-BATTLE-debug.apk
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/mass-battle-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

      - name: Verify APK archive
        run: |
          unzip -t build/MASS-BATTLE-debug.apk
          ls -lh build/MASS-BATTLE-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MASS-BATTLE-Android-debug
          path: build/MASS-BATTLE-debug.apk
          if-no-files-found: error
          retention-days: 14
